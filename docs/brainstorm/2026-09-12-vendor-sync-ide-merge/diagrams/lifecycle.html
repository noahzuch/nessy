<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vendor-sync — action lifecycle</title>
<style>
  body { margin: 0; padding: 24px; background: #fff; color: #1f2328; font: 14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; width: 900px; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: #57606a; font-size: 12.5px; }
  svg text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<h1>vendor-sync — action lifecycle (state diagram)</h1>
<p>The marker in <code>.vendor.json</code> is the state. Every arrow is one script call, labeled with the call and, after a colon, the result. Committed and Discarded are outcomes of a call, not marker states.</p>
<svg width="880" height="640" viewBox="0 0 880 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>

  <!-- closed state -->
  <rect x="10" y="215" width="170" height="90" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="95" y="245" text-anchor="middle" font-weight="600">No open action</text>
  <text x="95" y="266" text-anchor="middle" class="mono" font-size="12">in_progress: null</text>
  <text x="95" y="286" text-anchor="middle" font-size="11.5" fill="#57606a">(or no manifest yet)</text>

  <!-- up_to_date self-loop -->
  <path d="M60,215 C40,150 150,150 130,215" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="95" y="150" text-anchor="middle" font-size="11.5" class="mono">sync: up_to_date</text>
  <text x="95" y="165" text-anchor="middle" font-size="11" fill="#57606a">nothing written</text>

  <!-- open states -->
  <g font-size="12.5">
    <rect x="330" y="40"  width="220" height="56" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="440" y="63" text-anchor="middle" font-weight="600" class="mono">add · ready</text>
    <text x="440" y="83" text-anchor="middle" font-size="11.5" fill="#57606a">only the manifest written</text>

    <rect x="330" y="150" width="220" height="56" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="440" y="173" text-anchor="middle" font-weight="600" class="mono">sync · pin_ready</text>
    <text x="440" y="193" text-anchor="middle" font-size="11.5" fill="#57606a">only the marker written</text>

    <rect x="330" y="260" width="220" height="56" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="440" y="283" text-anchor="middle" font-weight="600" class="mono">add · merge_staged</text>
    <text x="440" y="303" text-anchor="middle" font-size="11.5" fill="#57606a">conflict state, empty base</text>

    <rect x="330" y="370" width="220" height="56" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="440" y="393" text-anchor="middle" font-weight="600" class="mono">sync · merge_staged</text>
    <text x="440" y="413" text-anchor="middle" font-size="11.5" fill="#57606a">conflict state written</text>
  </g>

  <!-- starts -->
  <g stroke="#57606a" stroke-width="1.5" fill="none">
    <path d="M180,235 L328,70"  marker-end="url(#a)"/>
    <path d="M180,250 L328,178" marker-end="url(#a)"/>
    <path d="M180,270 L328,288" marker-end="url(#a)"/>
    <path d="M180,290 L328,396" marker-end="url(#a)"/>
  </g>
  <g font-size="11" class="mono" fill="#1f2328">
    <text x="196" y="132" transform="rotate(-48 196 132)">add: ready</text>
    <text x="222" y="208" transform="rotate(-25 222 208)">sync: pin_ready</text>
    <text x="212" y="272" transform="rotate(5 212 272)">add: merge_staged</text>
    <text x="206" y="322" transform="rotate(34 206 322)">sync: merge_staged</text>
  </g>

  <!-- unresolved / commit failed loop on merge_staged -->
  <path d="M500,426 C520,480 380,480 400,426" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="450" y="482" text-anchor="middle" font-size="11" class="mono">--continue: exit 1</text>
  <text x="450" y="497" text-anchor="middle" font-size="11" fill="#57606a">applies to every open state: still unmerged (merge_staged) or the commit failed</text>


  <!-- interrupted start -->
  <rect x="330" y="540" width="220" height="56" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="440" y="563" text-anchor="middle" font-weight="600" class="mono" font-size="12.5">add | sync · merging</text>
  <text x="440" y="583" text-anchor="middle" font-size="11.5" fill="#57606a">start interrupted after the plan</text>
  <path d="M120,305 L120,330 C120,560 200,568 328,568" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="150" y="520" font-size="11" class="mono">merge start: fails midway</text>
  <path d="M550,560 C640,520 660,420 688,372" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#r)"/>
  <text x="600" y="610" font-size="11" class="mono" fill="#cf222e">only --abort (--continue: exit 2)</text>

  <!-- closed outcomes -->
  <rect x="690" y="110" width="180" height="84" rx="12" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="780" y="140" text-anchor="middle" font-weight="600">Committed</text>
  <text x="780" y="160" text-anchor="middle" font-size="11.5">one new commit,</text>
  <text x="780" y="176" text-anchor="middle" font-size="11.5" class="mono">in_progress: null</text>

  <rect x="690" y="290" width="180" height="84" rx="12" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <text x="780" y="320" text-anchor="middle" font-weight="600">Discarded</text>
  <text x="780" y="340" text-anchor="middle" font-size="11.5">directory back at HEAD,</text>
  <text x="780" y="356" text-anchor="middle" font-size="11.5">marker or manifest gone</text>

  <g stroke="#1a7f37" stroke-width="1.5" fill="none">
    <path d="M550,62  L688,135" marker-end="url(#g)"/>
    <path d="M550,172 L688,148" marker-end="url(#g)"/>
    <path d="M550,282 L688,162" marker-end="url(#g)"/>
    <path d="M550,392 L688,176" marker-end="url(#g)"/>
  </g>
  <text x="588" y="118" font-size="11" class="mono" fill="#1a7f37" font-weight="600">--continue: commit</text>

  <g stroke="#cf222e" stroke-width="1.5" fill="none" stroke-dasharray="5 3">
    <path d="M550,80  L688,308" marker-end="url(#r)"/>
    <path d="M550,190 L688,318" marker-end="url(#r)"/>
    <path d="M550,300 L688,330" marker-end="url(#r)"/>
    <path d="M550,410 L688,345" marker-end="url(#r)"/>
  </g>
  <text x="588" y="400" font-size="11" class="mono" fill="#cf222e" font-weight="600">--abort: restored</text>

  <!-- back to closed -->
  <path d="M780,374 L780,625 L40,625 L40,307" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a)"/>
  <path d="M870,152 L874,152 L874,625 L780,625" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="700" y="638" text-anchor="middle" font-size="11.5" fill="#57606a">closed again; the next start begins here</text>
</svg>

<svg width="880" height="70" viewBox="0 0 880 70" xmlns="http://www.w3.org/2000/svg">
  <line x1="0" y1="6" x2="880" y2="6" stroke="#d0d7de"/>
  <text x="0" y="32" font-weight="600" font-size="12.5">Legend</text>
  <rect x="60" y="18" width="34" height="20" rx="5" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/><text x="100" y="33" font-size="12">closed</text>
  <rect x="150" y="18" width="34" height="20" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="190" y="33" font-size="12">open action (marker state)</text>
  <line x1="350" y1="28" x2="390" y2="28" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#g)"/><text x="398" y="33" font-size="12">--continue commits</text>
  <line x1="530" y1="28" x2="570" y2="28" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#r)"/><text x="578" y="33" font-size="12">--abort restores</text>
  <rect x="700" y="18" width="34" height="20" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/><text x="740" y="33" font-size="12">outcome</text>
  <line x1="790" y1="28" x2="830" y2="28" stroke="#57606a" stroke-width="1.5" stroke-dasharray="2 4"/><text x="836" y="33" font-size="12">closed</text>
  <text x="0" y="58" font-size="11.5" fill="#57606a">A start that finds an open action exits 1 with choices — resume (= --continue; never for merging), abort (= --abort), leave — and changes no state.</text>
</svg>
</body>
</html>
